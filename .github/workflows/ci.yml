name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run core test suite
        run: |
          python -m pytest \
            tests/test_openclaw_feishu_multi_agent_skill.py \
            tests/test_v51_ingress_adapter.py \
            tests/test_v51_outbox_sender.py \
            tests/test_v51_runtime_store.py \
            tests/test_v51_team_controller.py \
            tests/test_v51_worker_callback_sink.py \
            -q
